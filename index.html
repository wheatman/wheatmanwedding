<body>

    <div class="password-box">

        <h1>Brian &amp; Marissa</h1>

        <p>Enter the password to visit our wedding website.</p>

        <form id="password-form">

            <input type="password" id="password" placeholder="Password" autocomplete="off" autofocus>

            <button type="submit">
                Enter
            </button>

        </form>

        <div id="error"></div>

    </div>


    <script>

        // SHA-256 hash of the correct password.
        // Replace this with the hash of your actual password.
        const PASSWORD_HASH =
            "d5af65e13d51f724eb0db7774588c66b8ea0673b012fa82642f0c823a3695062";


        async function hashPassword(password) {

            const data = new TextEncoder().encode(password);

            const hashBuffer =
                await crypto.subtle.digest("SHA-256", data);

            const hashArray =
                Array.from(new Uint8Array(hashBuffer));

            return hashArray
                .map(byte => byte.toString(16).padStart(2, "0"))
                .join("");

        }


        document
            .getElementById("password-form")
            .addEventListener("submit", async function (event) {

                event.preventDefault();

                const password =
                    document.getElementById("password").value;

                const hash =
                    await hashPassword(password);

                if (hash === PASSWORD_HASH) {

                    window.location.href = "wedding.html";

                } else {

                    document.getElementById("error").textContent =
                        "Incorrect password.";

                }

            });

    </script>
